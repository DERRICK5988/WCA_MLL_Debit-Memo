    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/YY1_PRODUCT_CDS
            metadataPath: ./webapp/localService/YY1_PRODUCT_CDS/metadata.xml
            mockdataPath: ./webapp/localService/YY1_PRODUCT_CDS/data
            generateMockData: true
