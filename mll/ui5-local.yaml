# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: mll
type: application
framework:
  name: SAPUI5
  version: 1.131.1
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: mll
        ui5Theme: sap_horizon
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        backend:
          - path: /sap/opu/odata/sap/YY1_CUSTOMER_REF_CDS
            url: https://my403379-api.s4hana.cloud.sap
            destination: S4HC-Customizing-my403379-Basic
            authenticationType: BasicAuthentication
          - path: /sap/opu/odata/sap/YY1_DEBIT_MEMO_CDS
            url: https://my403379-api.s4hana.cloud.sap
            destination: S4HC-Customizing-my403379-Basic
            authenticationType: BasicAuthentication
          - path: /sap/opu/odata/sap/YY1_LABIDV_CDS
            url: https://my403379-api.s4hana.cloud.sap
            destination: S4HC-Customizing-my403379-Basic
            authenticationType: BasicAuthentication
          - path: /sap/opu/odata/sap/YY1_PRODUCT_CDS
            url: https://my403379-api.s4hana.cloud.sap
            destination: S4HC-Customizing-my403379-Basic
