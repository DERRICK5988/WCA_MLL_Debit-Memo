_schema-version: "3.2"
ID: mll
description: Generated by Fiori Tools
version: 0.0.16
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
  service-suffix: quality  # ✨ Default suffix (Developer = dev, Quality = quality, Production = prod)

modules:
- name: mll-destination-content
  type: com.sap.application.content
  requires:
  - name: mll-destination-service  # ✅ Matches the resource name
    parameters: 
      content-target: true
  - name: mll-repo-host
    parameters:
      service-key:
        name: mll-repo-host-key-${service-suffix}  # ✨ Parameterized
  - name: uaa_mll
    parameters:
      service-key:
        name: mll-uaa-key-${service-suffix}  # ✨ Parameterized
  parameters:
    content:
      instance:
        destinations:
        - Name: mll_html_repo_host_${service-suffix}  # ✨
          ServiceInstanceName: mll-html5-srv-${service-suffix}  # ✨
          ServiceKeyName: mll-repo-host-key-${service-suffix}  # ✨
          sap.cloud.service: mll
        - Authentication: OAuth2UserTokenExchange
          Name: mll_uaa_${service-suffix}  # ✨
          ServiceInstanceName: mll-xsuaa-service-${service-suffix}  # ✨
          ServiceKeyName: mll-uaa-key-${service-suffix}  # ✨
          sap.cloud.service: mll
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true

- name: mll-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: mll-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - mll.zip
      name: mll
      target-path: resources/

- name: mll
  type: html5
  path: .
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []

- name: mll-approuter
  type: approuter.nodejs
  path: mll-approuter
  requires:
  - name: mll_html_repo_runtime
  - name: mll-destination-service  # ✅ Matches the resource name
  - name: uaa_mll
  parameters:
    disk-quota: 256M
    memory: 256M
    buildpack: nodejs_buildpack

resources:
- name: mll-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: mll-html5-srv-${service-suffix}  # ✨ Parameterized
    service-plan: app-host

- name: mll-destination-service  # ✅ REQUIRED by modules
  type: org.cloudfoundry.managed-service
  parameters:
    service: destination
    service-name: mll-destination-service-${service-suffix}  # ✨
    service-plan: lite
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0

- name: mll_html_repo_runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime

- name: uaa_mll
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: mll-xsuaa-service-${service-suffix}  # ✨
    service-plan: application
    config:  # ✨ Override xsappname here
      xsappname: mll-${service-suffix}  # Unique per environment (mll-dev, mll-quality, etc.)